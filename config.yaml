# =====================================================================================
#  ALL bot parameters live in this file. Edit, then restart the bot (python run.py).
#  config.py only reads this file; nothing is hardcoded elsewhere.
#
#  RULE: if you change a strategy's logic or parameters, also change its `name` (e.g. add _v2),
#  otherwise old and new results blend into one meaningless track record (the bot warns you).
# =====================================================================================

exchange: polymarket_us          # polymarket_us (polymarket.us) | polymarket_intl (polymarket.com)

# ---------------------------------------------------------------- markets
# The asset is a config value. Each entry trades that asset's Up/Down rounds of each listed length.
# To add ETH later: copy the block, change symbol / spot product / index / slug_prefix.
assets:
  - symbol: BTC
    windows: [5m, 15m]                # which round lengths to trade
    slug_prefix: "btc-updown-{window}" # Polymarket series, e.g. btc-updown-5m
    index_asset: "crypto:btc"         # settlement reference on Polymarket US (CF Benchmarks BRTI)
    spot_product: BTC-USD             # Coinbase product (spot.source: coinbase)
    spot_symbol: btcusdt              # Binance symbol (spot.source: binance / binanceus -> btcusd)
    fee_rate: 0.07                    # polymarket.com only (crypto); Polymarket US uses the tiers below

# ---------------------------------------------------------------- A1: spot feed
spot:
  source: coinbase                    # coinbase | binance | binanceus (binance.com blocks US IPs)
  stale_seconds: 5                    # a price older than this counts as missing
  bootstrap_vol_from_candles: true    # seed sigma from the last 5h of 1-minute candles at startup

# ---------------------------------------------------------------- A2 + A3: volatility & fair value
model:
  vol_half_life_seconds: 300          # EWMA half-life of 1-second log returns
  vol_min_samples: 30                 # sigma unavailable until this many returns (unless seeded)
  sigma_multiplier: 1.0               # > 1 inflates vol for fat-tail safety
  # 2026-11-09: switched normal -> student_t (df 4). Recorded 3-sigma moves happened ~2% of the time vs 0.27%
  # under the normal; df 4 improved the model's Brier score 0.1613 -> 0.1601 (the market mid: 0.1577).
  # df = 4 was chosen on the SAME data the strategies are evaluated on. It is a FIXED design choice from now on:
  # do not re-tune it. Strategies whose decisions use the model were renamed with a _t4 suffix (see below).
  distribution: student_t             # normal | student_t
  student_t_df: 4                     # degrees of freedom (student_t only; rescaled to unit variance)
  min_seconds: 1                      # t is floored at this
  require_published_k: true           # no fair value (no trading) until the exchange publishes K, a few
                                      # seconds into each round; fallbacks below are only estimates
  k_fallback_to_oracle: true          # (only if require_published_k is false) K from the oracle's first print
  # S (the "current" price). The spec uses the settlement oracle, but the served index is a 60s average
  # (see below), so `oracle` makes fair value ~30s stale on fast moves; `spot` uses the fast feed.
  s_source: spot                      # oracle | spot (the other is the fallback)
  # The index Polymarket US serves IS a trailing 60s average of BRTI (tickCount 60 per 1s candle; K equals
  # it at the window start) -- that's the "~30s lag". Basis is measured like for like (60s mean of spot vs
  # the index) and, with s_source: spot, K is moved into spot's terms by it (basis_adjust).
  oracle_average_seconds: 60
  basis_adjust: true
  # Market rules: the open (K) and close are each the AVERAGE of 60 BRTI prints in the minute before.
  # 0 = the spec's point-settlement formula; 60 = model the averaging (matters most in the last ~2 min).
  settlement_average_seconds: 60

# ---------------------------------------------------------------- A4: fees
fees:
  # auto = the exchange's published schedule, confirmed 2026-11-07 at https://docs.polymarket.us/fees:
  #   taker fee = theta x contracts x p x (1-p), rounded to the cent (half-even); theta by the strategy's
  #   own 30-day taker volume: 0.095 (<$10k), 0.085, 0.075, 0.0695 ($250k+). Makers pay 0.
  # placeholder = fee_peak x 4 x p x (1-p) per share (a WARNING is printed at startup).
  model: auto                         # auto | polymarket_us | polymarket_intl | placeholder
  fee_peak: 0.0156                    # placeholder only (fee per share at p = 0.50)
  maker_rebate_theta: 0.0             # Polymarket US maker rebates start at $10M of volume -> 0 here
  us_new_account: null                # null | "per_strategy" | "YYYY-MM-DD" (7-day 0.0695 onboarding rate)
  us_theta_override: null             # force one taker theta

# ---------------------------------------------------------------- A5: paper fills
fills:
  latency_ms: 250                     # taker orders fill against the book fetched this long AFTER the decision
  maker_conservative_queue: true      # maker fills: charge the queue ahead of us against trade-through volume
  adverse_selection_seconds: 5        # record fair value this long after every maker fill
  extra_slippage: 0.0                 # optional extra cost per share on taker fills (pessimism knob)

# ---------------------------------------------------------------- A7: risk (global; applied per strategy account)
risk:
  max_usd_per_trade: 50
  max_usd_per_market: 100             # cost basis in one round
  max_open_markets: 4
  basis_kill_pct: 0.05                # |60s-avg spot - oracle| / oracle in PERCENT (0.05 = 0.05%) -> kill switch
  require_both_feeds: true            # missing spot or oracle price also trips the kill switch

# ---------------------------------------------------------------- round validity (core/validity.py)
# A round counts in the statistics only if it was recorded well enough. DATA COVERAGE ONLY: the rule never looks at
# P&L or results and is the same for every strategy. Invalid rounds keep all their data; statistics leave them out
# by default and say how many (tools: --include-invalid). Evidence (716 rounds, 2026-11-07..09): worst gap per
# round p99 = 8.8s (5m) / 12.3s (15m), outages 132-264s; these thresholds marked 19 rounds (2.7%).
validity:
  max_gap_seconds: 10                 # a longer hole between two recorded ticks (or at the round's start / end)
  min_coverage: 0.90                  # recorded ticks / expected ticks (round length / engine.poll_seconds)
  max_missing_share: 0.10             # share of ticks without a spot price, or without a model fair value
                                      # also invalid: the bot (re)started during the round; a CRITICAL clock-drift alert

# ---------------------------------------------------------------- health: clock drift + uptime (core/health.py)
# Observes and records only; it never stops trading. `python tools/health.py` shows the current state.
health:
  enabled: true
  check_seconds: 60                   # one clock reading a minute (stored in the `health` table)
  heartbeat_seconds: 60               # bot_runs.last_seen refresh (uptime / downtime)
  method: both                        # exchange | ntp | both
                                      #   exchange: this clock vs the exchange's timestamp on every book poll (no extra
                                      #             requests); reading = smallest offset of the minute - expected latency
                                      #   ntp:      is the system clock still NTP-synchronized (timedatectl)?
  warn_seconds: 0.5                   # |drift| at or above this -> warning + events row
  critical_seconds: 1.5               # ... at or above this -> critical: overlapping rounds are marked invalid
  expected_latency_seconds: 0.15      # network + processing delay of the FASTEST poll in a minute (Pi: p1 = 0.11s)
  min_samples: 5                      # fewer book polls than this in a minute -> no reading (level "nodata")

# ---------------------------------------------------------------- portfolio
portfolio:
  starting_bankroll: 1000             # each strategy has its own separate paper bankroll
  stop_equity: 200                    # a strategy stops trading for good once its portfolio value (cash + open
                                      # bets at the mid) is $200 or less; open bets still settle (null = never).
                                      # This is the only stop: there is no daily loss limit.

# ---------------------------------------------------------------- engine
engine:
  poll_seconds: 2                     # Polymarket US allows 25 requests/s per IP
  equity_every_seconds: 5             # how often account values are checked; a row is saved only when the value
  equity_heartbeat_seconds: 60        # changed, plus one row per strategy this often (keeps the table small)
  settle_check_seconds: 15
  settle_warn_seconds: 3600
  settle_max_lookups: 6
  provisional_recheck_seconds: 60
  book_levels_logged: 10
  # Disk plan: the raw order-book log (`books`) is ~half of all DB growth (~50 MB/day), so only the last
  # few days are kept in full. Everything compact (top-of-book `snapshots`, fills, settlements, equity,
  # market_stats) is kept. The nightly backup (tools/backup_db.sh) is what preserves older books.
  books_keep_days: 3                  # null = keep raw order books forever
  export_dir: data/exports            # daily CSV of all trades: trades_YYYY-MM-DD.csv (ET day)
  db_path: null                       # null = data/paper_us.db (US) or data/paper.db (intl)

# ---------------------------------------------------------------- websocket recorder (separate process)
# python tools/ws_recorder.py   (systemd: polymarket-recorder). Needs PM_KEY_ID / PM_SECRET_KEY (see .env.example).
recorder:
  db_path: data/ws_events.db          # its own file: can never lock or bloat paper_us.db
  next_rounds: 1                      # also subscribe the NEXT n rounds of every configured market
  debounce: false                     # true = exchange batches book updates (fewer rows, coarser)
  stale_seconds: 90                   # no message at all for this long -> reconnect (watchdog; the exchange sends no heartbeats)
  book_levels: 10                     # price levels per side kept in ws_book (the feed sends ~100; they're full snapshots)
  book_min_interval_ms: 500           # at most one ws_book row per market per this long (changed content only)
  # Retention is per table. Observed rates: ws_book ~150 MB/day, ws_trades ~250 MB/day, so 7 + 7 days is ~2.8 GB.
  book_keep_days: 7                   # ws_book kept this long
  trades_keep_days: 7                 # ws_trades kept this long
  max_db_mb: 3000                     # total cap over ALL recorded tables: oldest rows of ws_book AND ws_trades are
                                      #   deleted in proportion to their size until live data <= trim_target_pct of it.
                                      #   If nothing trimmable is left and it is still over, an ERROR is logged.
  trim_target_pct: 90                 # a cap trim goes down to this % of max_db_mb (avoids trimming every pass)
  min_keep_hours: 24                  # rows newer than this are NEVER deleted (retention or cap); gap markers never are
  trim_batch_rows: 20000              # rows per delete batch (committed between batches)
  prune_budget_s: 5                   # max seconds one housekeeping pass may block the recorder; leftovers continue later
  vacuum_chunk_pages: 2000            # incremental_vacuum chunk (needs auto_vacuum; see tools/db_convert_autovac.py)
  vacuum_pause_ms: 20                 # pause between vacuum chunks
  vacuum_min_free_mb: 64              # only vacuum when at least this much is free inside the file
  disk_log_seconds: 600               # log DB size + free disk this often

# ---------------------------------------------------------------- replay options
replay:
  ws_book_max_age_s: 60               # --latency-book ws: a websocket book older than this at decision+latency is not used (fallback)
  # Named profiles: `python tools/replay.py --profile pessimistic` / `python tools/validate.py --profile pessimistic`.
  # THE PESSIMISTIC RULE (docs/PASS_CRITERIA.md): a candidate must still pass when replayed with +1c extra slippage
  # per share and a 500-1000 ms order latency. The profile uses the hard end (1000 ms); --latency-ms 500 overrides.
  profiles:
    pessimistic:
      extra_slippage: 0.01            # added to fills.extra_slippage for the replay only
      latency_ms: 1000
      latency_book: auto              # ws (book rebuilt at decision + latency) if a websocket recording exists,
                                      # otherwise next (the next recorded book, ~2 s later: stricter)

# ---------------------------------------------------------------- tools/validate.py (holdout validation)
validate:
  bootstrap_n: 2000                   # resamples (of ROUNDS) for the per-trade expectancy CI
  seed: 12345
  reveal_log: data/holdout_reveals.log
  # "LOW CONFIDENCE ON DOLLARS" flag. Evidence: replay fills against the decision-time book, live fills against a
  # book fetched ~250 ms later; self-check: s3_sniper_v2 live -$349 vs replay -$236, and 58 longshot rounds
  # (entry < $0.20) explain $132 of the $156 gap. So a strategy is flagged when:
  low_price_floor: 0.20               # ... more than low_price_share of its fills are below this entry price, or
  low_price_share: 0.25               # (applies to the share of fills AND the share of shares bought)
  depth_ratio: 1.0                    # ... more than depth_share of its fills are bigger than this x displayed best-ask depth
  depth_share: 0.25

# =====================================================================================
#  PART B - STRATEGIES. Each one: enabled, its own name / bankroll / markets, and its params.
#  markets: list of round lengths it trades ([5m, 15m]); omit for all.
#  stake_usd: dollars per entry (risk.max_usd_per_trade caps it).
# =====================================================================================
strategies:
  s1_fair_value:
    enabled: false                    # 2026-11-09: hit the $200 stop (-$816 in 92 rounds) and can never trade again
                                      # under this name. To run it again, change `name` and set enabled: true.
    name: s1_fair_value_v2            # v2 (2026-11-07): model shrunk toward the market, stale-quote guards
    title: "S1 · Fair-value trader"
    description: "Buys a side when model+market fair value beats the ask by 4c after fees; skips jumps, huge gaps, longshots."
    markets: [5m, 15m]
    params:
      min_edge: 0.04
      market_weight: 0.5              # fair = 50% model + 50% market mid (the market predicted better than the model alone)
      max_model_gap: 0.25             # model vs mid further apart than this = data/stale-quote problem -> skip
      min_price: 0.10
      max_price: 0.90
      max_spread: 0.05
      jump_lookback_seconds: 5
      jump_guard_sigmas: 3.0          # spot just jumped -> quotes are stale, a paper fill there isn't believable
      skip_first_seconds: 30
      skip_last_seconds: 10
      max_entries_per_window: 1
      stake_usd: 25
      early_exit: false
      exit_threshold: 0.03

  s2_market_maker:
    enabled: false                    # 2026-11-09: hit the $200 stop (-$821 in 52 rounds); new `name` to run again
    name: s2_market_maker_v1
    title: "S2 · Market maker"
    description: "Rests bids on both sides around fair value, skewed by inventory; fills only on trade-through."
    markets: [5m, 15m]
    params:
      half_spread: 0.02
      skew_per_share: 0.0005
      requote_threshold: 0.01
      guard_bps: 5.0
      guard_cooldown_seconds: 3
      stop_quoting_seconds: 45
      skip_first_seconds: 5
      quote_shares: 20
      max_imbalance_shares: 100

  s3_sniper:
    enabled: true
    name: s3_sniper_v2                # v2 (2026-11-07): buys the winning side in the last 60s, no other filters
    title: "S3 · End-of-window sniper"
    description: "In the last 60s of every 5m and 15m round, buys whichever side is winning (index vs price to beat)."
    markets: [5m, 15m]
    params:
      snipe_seconds: 60
      stake_usd: 25

  # ---- S3 v3 variants (2026-11-08). v2 above stays unchanged as the CONTROL. v2's live result: 169 trades,
  # -$196; the 39 trades that paid under 70c lost $306 because the lagged index said "winning" while the market
  # disagreed. Each variant below has its own bankroll (`class:` = which strategy code it runs).
  s3_sniper_v3a:
    class: s3_sniper
    enabled: true
    name: s3_sniper_v3a_floor50
    title: "S3a · Sniper, market agrees (ask ≥ 50c)"
    description: "Sniper v2 + only buys if the winning side's ask is ≥ 50c (the market also thinks it's ahead)."
    markets: [5m, 15m]
    params:
      snipe_seconds: 60
      min_price: 0.50
      stake_usd: 25

  s3_sniper_v3b:
    class: s3_sniper
    enabled: true
    name: s3_sniper_v3b_floor70
    title: "S3b · Sniper, market confident (ask ≥ 70c)"
    description: "Sniper v2 + only buys if the winning side's ask is ≥ 70c."
    markets: [5m, 15m]
    params:
      snipe_seconds: 60
      min_price: 0.70
      stake_usd: 25

  s3_sniper_v3c:
    class: s3_sniper
    enabled: true
    name: s3_sniper_v3c_floor70_cap97
    title: "S3c · Sniper, 70c–97c band"
    description: "Sniper v3b + skips asks above 97c (a win pays < 3c there, one loss erases dozens of wins)."
    markets: [5m, 15m]
    params:
      snipe_seconds: 60
      min_price: 0.70
      max_price: 0.97
      stake_usd: 25

  s3_sniper_v3d:
    class: s3_sniper
    enabled: true
    name: s3_sniper_v3d_model_floor50
    title: "S3d · Sniper, live-spot model signal"
    description: "Decides 'winning' with the fair-value model (live spot, settlement averaging) instead of the lagged index; ask ≥ 50c."
    markets: [5m, 15m]
    params:
      snipe_seconds: 60
      signal: model
      min_price: 0.50
      stake_usd: 25

  s4_momentum:
    enabled: true
    name: s4_momentum_v1
    title: "S4 · Crowd-momentum confirmation"
    description: "Buys a side priced >= 70c when spot and the oracle both moved its way since the open."
    markets: [5m, 15m]
    params:
      min_side_price: 0.70
      max_entry: 0.90
      min_edge: null
      skip_first_seconds: 30
      skip_last_seconds: 10
      stake_usd: 25
    variant_4b:                       # runs as its own strategy with its own bankroll
      enabled: true
      name: s4b_minute_buckets_v1
      title: "S4b · One-minute buckets"
      description: "5m only: if spot rose (fell) in each of the first 3 minutes, buys Up (Down) at the final minute, ask <= 85c."
      markets: [5m]
      params:
        buckets: 3
        max_entry: 0.85
        entry_window_seconds: 10
        stake_usd: 25

  # ---- S4 variants (2026-11-08). s4_momentum_v1 above is unchanged (control). Offline replay of v1 on the
  # logged ticks: confirmation filters 79.2% wins / +$0.68 per trade vs 78.0% / +$0.49 for just buying every
  # favorite >= 70c -- so most of S4 is "buy the favorite"; these test which tweak (if any) adds to it.
  s4_momentum_min80:
    class: s4_momentum
    enabled: true
    name: s4_momentum_min80_v1
    title: "S4·80 · Momentum, side ≥ 80c"
    description: "S4 but the crowd must price the side ≥ 80c (the 80–90c entries had the best margin over breakeven)."
    markets: [5m, 15m]
    params:
      min_side_price: 0.80
      max_entry: 0.90
      skip_first_seconds: 30
      skip_last_seconds: 10
      stake_usd: 25

  s4_momentum_edge:
    class: s4_momentum
    enabled: false                    # RETIRED 2026-11-09: ran on the normal model. Replaced by s4_momentum_edge_t4
                                      # below (same parameters, Student-t model). History stays in the database.
    name: s4_momentum_edge0_v1
    title: "S4·E · Momentum, model edge ≥ 0"
    description: "S4 but also requires the fair-value model to see non-negative edge after fees."
    markets: [5m, 15m]
    params:
      min_side_price: 0.70
      max_entry: 0.90
      min_edge: 0.0
      skip_first_seconds: 30
      skip_last_seconds: 10
      stake_usd: 25

  s4_momentum_edge_t4:
    class: s4_momentum
    enabled: true
    name: s4_momentum_edge0_v1_t4     # = s4_momentum_edge0_v1 on the Student-t (df 4) model: its edge gate uses the model
    title: "S4·E · Momentum, model edge ≥ 0 (t4)"
    description: "S4 but also requires the fair-value model (Student-t, df 4) to see non-negative edge after fees."
    markets: [5m, 15m]
    params:
      min_side_price: 0.70
      max_entry: 0.90
      min_edge: 0.0
      skip_first_seconds: 30
      skip_last_seconds: 10
      stake_usd: 25

  s4_momentum_15m:
    class: s4_momentum
    enabled: true
    name: s4_momentum_15m_v1
    title: "S4·15 · Momentum, 15m only"
    description: "S4 on 15-minute rounds only (15m made $1.24/trade vs $0.39 on 5m)."
    markets: [15m]
    params:
      min_side_price: 0.70
      max_entry: 0.90
      skip_first_seconds: 30
      skip_last_seconds: 10
      stake_usd: 25

  s4b_minute_buckets_v2:
    class: s4b_minute_buckets
    enabled: true
    name: s4b_minute_buckets_v2
    title: "S4b v2 · One-minute buckets, market agrees"
    description: "S4b + only buys if the side's mid is ≥ 50c (v1 lost 5 of 5 buying 2–35c sides)."
    markets: [5m]
    params:
      buckets: 3
      max_entry: 0.85
      entry_window_seconds: 10
      min_side_price: 0.50
      stake_usd: 25

  s5_complete_set:
    enabled: false                    # 2026-11-09: hit the $200 stop (-$847, $755 of it fees); new `name` to run again
    name: s5_complete_set_v2          # v2 (2026-11-07): legged-in set with take profit / stop loss / time exit
    title: "S5 · Complete set (legged)"
    description: "15s in, buys the pricier side; buys the opposite leg when leg 1's price is +10% or -5%, or at 30s left."
    markets: [5m, 15m]
    params:
      entry_after_seconds: 15
      take_profit_pct: 10             # leg 2 when leg 1's price is up 10% ...
      stop_loss_pct: 5                # ... or down 5% ...
      pnl_basis: price                # price = leg 1's price move | locked = whole set incl. fees + spread
                                      # (locked starts at about -7.5%, so its 5% stop fires right after entry)
      exit_seconds_left: 30           # ... or 30 seconds are left
      stake_usd: 50                   # leg 1 dollars

  s6_mean_reversion:
    enabled: false                    # RETIRED 2026-11-09: ran on the normal model. Replaced by s6_mean_reversion_t4.
    name: s6_shock_reversion_v1
    title: "S6 · Shock mean reversion"
    description: "Fades a >= 12c price jump in 10s that fair value didn't confirm; exits at 50% reversion or 60s."
    markets: [5m]
    params:
      shock_size: 0.12
      shock_lookback: 10
      max_fair_move: 0.04
      min_edge: 0.03
      exit_mode: revert
      gap_close_frac: 0.5
      time_stop_seconds: 60
      stake_usd: 25

  s6_mean_reversion_t4:
    class: s6_mean_reversion
    enabled: true
    name: s6_shock_reversion_v1_t4    # = s6_shock_reversion_v1 on the Student-t (df 4) model (fair-value move + edge)
    title: "S6 · Shock mean reversion (t4)"
    description: "Fades a >= 12c price jump in 10s that fair value (Student-t, df 4) didn't confirm; exits at 50% reversion or 60s."
    markets: [5m]
    params:
      shock_size: 0.12
      shock_lookback: 10
      max_fair_move: 0.04
      min_edge: 0.03
      exit_mode: revert
      gap_close_frac: 0.5
      time_stop_seconds: 60
      stake_usd: 25

  # ---- S7 (2026-11-09): the 15m round and the 5m round that close together settle on the same BRTI average,
  # so 15m UP + 5m DOWN (or the mirror, depending on which price to beat is higher) always pays >= $1.
  # Recorded books 11-07 -> 11-09: only 4 of 175 pairs were ever <= $0.99 all-in -> expect rare, small trades.
  s7_nested_pair:
    enabled: true
    name: s7_nested_pair_v1
    title: "S7 · Nested 5m/15m pair (locked)"
    description: "Buys 15m Up + 5m Down (or the mirror) when the two cost <= 99c together after fees: pays >= $1, $2 if the close lands between the two prices to beat."
    markets: [5m, 15m]                # needs BOTH: each leg is bought on its own market's tick
    params:
      max_pair_cost: 0.99
      complete_slack: 0.03            # leg 2 allowed up to opening limit + 3c
      leg1_market: 5m                 # leg 1 on the 5m tick; leg 2 on the 15m tick right after
      max_other_age_seconds: 3
      min_seconds_left: 5
      min_pair_shares: 5
      stake_usd: 50                   # for the whole pair (about half per leg)

  s7_nested_pair_ev:
    class: s7_nested_pair
    enabled: false                    # RETIRED 2026-11-09: ran on the normal model. Replaced by s7_nested_pair_ev_t4.
    name: s7_nested_pair_ev_v1
    title: "S7·EV · Nested pair, band EV"
    description: "S7 + also opens when 1 + model P(close between the two prices to beat) - pair cost >= 2c, up to $1.05 per pair. Not riskless."
    markets: [5m, 15m]
    params:
      max_pair_cost: 0.99
      band_ev: true
      min_ev: 0.02
      max_ev_pair_cost: 1.05
      complete_slack: 0.03            # leg 2 allowed up to opening limit + 3c
      leg1_market: 5m                 # leg 1 on the 5m tick; leg 2 on the 15m tick right after
      max_other_age_seconds: 3
      min_seconds_left: 5
      min_pair_shares: 5
      stake_usd: 50

  s7_nested_pair_ev_t4:
    class: s7_nested_pair
    enabled: true
    name: s7_nested_pair_ev_v1_t4     # = s7_nested_pair_ev_v1 on the Student-t (df 4) model (P(band) comes from the model)
    title: "S7·EV · Nested pair, band EV (t4)"
    description: "S7 + also opens when 1 + model P(close between the two prices to beat) - pair cost >= 2c, up to $1.05 per pair. Not riskless."
    markets: [5m, 15m]
    params:
      max_pair_cost: 0.99
      band_ev: true
      min_ev: 0.02
      max_ev_pair_cost: 1.05
      complete_slack: 0.03            # leg 2 allowed up to opening limit + 3c
      leg1_market: 5m                 # leg 1 on the 5m tick; leg 2 on the 15m tick right after
      max_other_age_seconds: 3
      min_seconds_left: 5
      min_pair_shares: 5
      stake_usd: 50

  # ===================================================================================
  #  NO-SIGNAL CONTROLS (2026-11-09, strategies/controls.py). Same entry window, price band and stake as the
  #  family, with the signal removed. Own name, own bankroll, own version stamp. A strategy is judged as
  #  "strategy minus its control" on the rounds both traded (tools/validate.py; pairing in `controls:` below).
  #  These are part of the frozen test design: don't tune them.
  #  BANKROLL: $25,000 each, not $1,000. A control is EXPECTED to lose (it pays fees and spread with no signal): on
  #  the recorded day ctl_s6_random lost $774 and ctl_s4_fav70 $511, and under the pessimistic replay both hit the
  #  $200 stop within a day -- a stopped control is no control. The stake stays $25 per entry (stake_usd), so the
  #  bankroll changes nothing about what a control trades or its per-round P&L; it only keeps it alive (about a
  #  month at the worst observed rate). Judge controls in dollars per round, never in % return.
  # ===================================================================================
  ctl_s3_fav:
    class: ctl_sniper_favorite
    enabled: true
    name: ctl_s3_fav
    bankroll: 25000
    title: "CTL · Sniper control (favourite)"
    description: "Control for S3 v2 / v3a / v3d: in the last 60s buys the side with the higher ask. No index or model."
    markets: [5m, 15m]
    params:
      snipe_seconds: 60
      stake_usd: 25

  ctl_s3_fav70:
    class: ctl_sniper_favorite
    enabled: true
    name: ctl_s3_fav70
    bankroll: 25000
    title: "CTL · Sniper control (favourite, ask ≥ 70c)"
    description: "Control for S3 v3b: the favourite in the last 60s, only if its ask is ≥ 70c."
    markets: [5m, 15m]
    params:
      snipe_seconds: 60
      min_price: 0.70
      stake_usd: 25

  ctl_s3_fav70_97:
    class: ctl_sniper_favorite
    enabled: true
    name: ctl_s3_fav70_97
    bankroll: 25000
    title: "CTL · Sniper control (favourite, 70c–97c)"
    description: "Control for S3 v3c: the favourite in the last 60s, only if its ask is 70c–97c."
    markets: [5m, 15m]
    params:
      snipe_seconds: 60
      min_price: 0.70
      max_price: 0.97
      stake_usd: 25

  ctl_s4_fav70:
    class: ctl_momentum_favorite
    enabled: true
    name: ctl_s4_fav70
    bankroll: 25000
    title: "CTL · Momentum control (favourite ≥ 70c)"
    description: "Control for S4 v1 / edge / 15m: buys a side priced ≥ 70c (ask ≤ 90c), no spot or oracle confirmation."
    markets: [5m, 15m]
    params:
      min_side_price: 0.70
      max_entry: 0.90
      skip_first_seconds: 30
      skip_last_seconds: 10
      stake_usd: 25

  ctl_s4_fav80:
    class: ctl_momentum_favorite
    enabled: true
    name: ctl_s4_fav80
    bankroll: 25000
    title: "CTL · Momentum control (favourite ≥ 80c)"
    description: "Control for S4·80: buys a side priced ≥ 80c (ask ≤ 90c), no spot or oracle confirmation."
    markets: [5m, 15m]
    params:
      min_side_price: 0.80
      max_entry: 0.90
      skip_first_seconds: 30
      skip_last_seconds: 10
      stake_usd: 25

  ctl_s4b_fav:
    class: ctl_buckets_favorite
    enabled: true
    name: ctl_s4b_fav
    bankroll: 25000
    title: "CTL · Minute-buckets control (favourite)"
    description: "Control for S4b: at the start of the final minute (5m rounds) buys the favourite if ask ≤ 85c. No bucket test."
    markets: [5m]
    params:
      max_entry: 0.85
      entry_window_seconds: 10
      min_side_price: 0.50
      stake_usd: 25

  ctl_s6_random:
    class: ctl_shock_random
    enabled: true
    name: ctl_s6_random
    bankroll: 25000
    title: "CTL · Shock control (random side)"
    description: "Control for S6: on the same ≥ 12c jump in 10s buys a seeded-random side; sells after 60s. No model."
    markets: [5m]
    params:
      shock_size: 0.12
      shock_lookback: 10
      time_stop_seconds: 60
      seed: 12345
      stake_usd: 25

# ---------------------------------------------------------------- strategy -> its control (paired comparison)
# tools/validate.py reports, per strategy, the per-round P&L of the strategy minus this control on the rounds
